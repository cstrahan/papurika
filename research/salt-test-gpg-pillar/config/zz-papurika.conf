# Papurika GPG-pillar stress harness — included via default_include.
# Serves BOTH netapi modules so we can trigger GPG decryption via each:
#   rest_cherrypy :8000 (image default) + rest_tornado :8001 (here).

rest_tornado:
  port: 8001
  address: 0.0.0.0
  disable_ssl: True

netapi_enable_clients:
  - local
  - local_async
  - local_batch
  - local_subset
  - runner
  - runner_async
  - wheel
  - wheel_async

external_auth:
  pam:
    saltdev:
      - .*
      - '@runner'
      - '@wheel'
      - '@jobs'

token_expire: 43200

# --- GPG-encrypted pillar (mirrors prod: decrypt_pillar + gpg_keydir) ---
gpg_keydir: /etc/salt/gpgkeys
# Decrypt everything under the `secrets` pillar key with the gpg renderer
# (prod uses `decrypt_pillar: ['secrets:vault']`). Each encrypted value spawns
# one `gpg` subprocess at pillar-compile time (salt/renderers/gpg.py).
decrypt_pillar:
  - 'secrets'

# Force the COLD decrypt path on every pillar compile. Prod runs with
# pillar_cache: True + ttl 1800, so it only pays this on cache miss/refresh/new
# minion; turning the cache off here makes every request re-decrypt, which is
# exactly the cold-cache scenario we're trying to provoke.
pillar_cache: False
