# Papurika test overrides — auto-included by the master via
#   default_include: /home/salt/data/config/*.conf
# These keys are NOT set by the docker-salt-master image, so there's no
# conflict with the image-generated /etc/salt/master.

# Gates which salt-api client types are exposed. Required in Salt 3006+
# (post CVE-2024-22231); unset defaults to deny-all. Mirrors production.
netapi_enable_clients:
  - local
  - local_async
  - local_batch
  - local_subset
  - runner
  - runner_async
  - wheel
  - wheel_async

# eauth. The image creates an OS (PAM) user from SALT_API_USER/PASS, so try
# pam first. (If pam auth fails because salt-api runs as the non-root 'salt'
# user and can't read /etc/shadow, we'll switch to the file backend.)
external_auth:
  pam:
    saltdev:
      - .*
      - '@runner'
      - '@wheel'
      - '@jobs'

# Match production's 12h token lifetime.
token_expire: 43200
